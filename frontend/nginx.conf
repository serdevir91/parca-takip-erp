# SPA + /api reverse proxy. Large BOM/drawing uploads stream to the backend (no buffering).
upstream erp_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2G;
    client_body_timeout 3600s;
    send_timeout 3600s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/csv application/json application/javascript
               application/xml image/svg+xml application/wasm font/woff2;

    # ^~ so the static-file regex below never captures API paths (e.g. /api/.../x.png)
    location ^~ /api/ {
        proxy_pass http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: uvicorn trusts the first address, which a client could otherwise forge
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api responses carry their own security headers (backend/app/main.py)
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_max_temp_file_size 0;
    }

    # Hashed build assets: cache for a long time
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security_headers.conf;
    }

    # pdf.js worker and other static files
    location ~* \.(?:js|mjs|css|wasm|woff2?|png|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        include /etc/nginx/security_headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security_headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security_headers.conf;
    }
}
