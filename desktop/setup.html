<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB ERP</title>
<style>
  :root { --bg: #0f172a; --card: #111c33; --line: #24324f; --text: #e2e8f0; --muted: #94a3b8; --accent: #2563eb;
          --accent-2: #1d4ed8; --error: #f87171; --ok: #34d399; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { width: min(640px, calc(100vw - 32px)); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); display: grid; place-items: center;
          font-weight: 700; font-size: 20px; color: #fff; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .mode { border: 2px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; background: transparent;
          color: inherit; text-align: left; font: inherit; }
  .mode b { display: block; font-size: 15px; margin-bottom: 4px; }
  .mode.on { border-color: var(--accent); background: rgba(37, 99, 235, .12); }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: #0b1324;
          color: var(--text); font: inherit; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button.btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: #1a2742; color: var(--text);
               font: inherit; cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-2); }
  button:disabled { opacity: .6; cursor: default; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.error { display: block; background: rgba(248, 113, 113, .12); color: var(--error); }
  .msg.ok { display: block; background: rgba(52, 211, 153, .12); color: var(--ok); }
  .found { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .found button { font-size: 12px; padding: 5px 10px; }
  [hidden] { display: none !important; }
  .loader { display: none; text-align: center; }
  body.loading .wrap { display: none; }
  body.loading .loader { display: block; }
  .spin { width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
          margin: 0 auto 14px; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader"><div class="spin"></div><div class="muted">LAB ERP açılıyor…</div>
  <div id="slow" hidden style="margin-top:18px"><div class="muted" style="margin-bottom:10px">Açılış uzun sürüyor. Sunucu kapalı olabilir.</div><button class="btn" id="slow-btn" type="button">Bağlantı ayarlarını aç</button></div></div>
<div class="wrap">
  <div class="brand">
    <div class="logo"><svg width="24" height="26" viewBox="4 3 24 26" aria-hidden="true"><path fill="#fff" d="M12.5 5L19.5 5Q20.5 5 20.5 6Q20.5 7 19.5 7L19 7L19 12.4L25.2 22.6Q26.6 25.3 23.6 26.5L8.4 26.5Q5.4 25.3 6.8 22.6L13 12.4L13 7L12.5 7Q11.5 7 11.5 6Q11.5 5 12.5 5Z"/><path fill="#93c5fd" d="M10.6 18.6L21.4 18.6L23.6 22.3Q24.4 24 22.6 24.4L9.4 24.4Q7.6 24 8.4 22.3Z"/></svg></div>
    <div><h1>LAB ERP</h1><div class="muted" id="ver"></div></div>
  </div>
  <div class="card">
    <div class="muted" style="margin-bottom:14px">Bu bilgisayar nasıl çalışsın?</div>
    <div class="modes">
      <button class="mode" data-mode="server" type="button">
        <b>Bu bilgisayar sunucu</b>
        <span class="muted">Veriler bu bilgisayarda tutulur. Ağdaki diğer bilgisayarlar buna bağlanır.</span>
      </button>
      <button class="mode" data-mode="client" type="button">
        <b>Ağdaki sunucuya bağlan</b>
        <span class="muted">Veriler başka bir bilgisayarda. Bu bilgisayar ona bağlanır, her şey anında eşitlenir.</span>
      </button>
    </div>

    <div id="server" hidden>
      <label for="data_dir">Veri klasörü</label>
      <div class="row">
        <input id="data_dir" autocomplete="off">
        <button class="btn" id="pick" type="button">Gözat…</button>
      </div>
      <div class="hint">Veritabanı, teknik resimler ve günlük yedekler bu klasörde tutulur.</div>
      <label for="port">Port</label>
      <input id="port" inputmode="numeric" style="max-width:140px">
      <div class="hint">Diğer bilgisayarlar http://BU-BİLGİSAYARIN-ADRESİ:port ile bağlanır.</div>
      <div id="newdb">
        <label for="admin_password">Yönetici (admin) şifresi</label>
        <input id="admin_password" type="password" autocomplete="new-password">
        <div class="hint">Yeni veritabanı oluşturulacak. Kullanıcı adı: <b>admin</b>.</div>
      </div>
    </div>

    <div id="client" hidden>
      <label for="server_url">Sunucu adresi</label>
      <div class="row">
        <input id="server_url" placeholder="örnek: 192.168.1.20:8000" autocomplete="off">
        <button class="btn" id="test" type="button">Dene</button>
      </div>
      <div class="row" style="margin-top:8px; align-items:center">
        <button class="btn" id="scan" type="button">Ağda sunucu ara</button>
        <span class="muted" id="scanmsg"></span>
      </div>
      <div class="found" id="found"></div>
    </div>

    <div class="msg" id="msg"></div>
    <div class="actions">
      <button class="btn primary" id="go" type="button">Başlat</button>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let mode = "server";
  const show = (text, kind) => { const m = $("msg"); m.textContent = text || ""; m.className = "msg" + (text ? " " + kind : ""); };
  function setMode(m) {
    mode = m;
    document.querySelectorAll(".mode").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
    $("server").hidden = m !== "server";
    $("client").hidden = m !== "client";
  }
  async function refreshDb() {
    $("newdb").hidden = await window.pywebview.api.data_dir_has_db($("data_dir").value);
  }
  async function init() {
    const s = await window.pywebview.api.get_state();
    $("ver").textContent = "Masaüstü sürüm " + s.version;
    $("data_dir").value = s.data_dir;
    $("port").value = s.port;
    $("server_url").value = s.server_url;
    setMode(s.mode);
    $("newdb").hidden = s.has_db;
    if (s.error) show(s.error, "error");
    document.querySelectorAll(".mode").forEach((b) => b.onclick = () => setMode(b.dataset.mode));
    $("data_dir").onchange = refreshDb;
    $("pick").onclick = async () => {
      const f = await window.pywebview.api.pick_folder($("data_dir").value);
      if (f) { $("data_dir").value = f; refreshDb(); }
    };
    $("test").onclick = async () => {
      const r = await window.pywebview.api.test_server($("server_url").value);
      show(r.ok ? "Bağlantı başarılı: " + r.url : r.error, r.ok ? "ok" : "error");
      if (r.ok) $("server_url").value = r.url;
    };
    $("scan").onclick = async () => {
      $("scan").disabled = true; $("scanmsg").textContent = "Aranıyor…"; $("found").innerHTML = "";
      const list = await window.pywebview.api.discover();
      $("scan").disabled = false;
      $("scanmsg").textContent = list.length ? list.length + " sunucu bulundu:" : "Sunucu bulunamadı. Adresi elle yazın.";
      for (const s of list) {
        const b = document.createElement("button");
        b.className = "btn"; b.type = "button"; b.textContent = s.name + " · " + s.url;
        b.onclick = () => { $("server_url").value = s.url; show("", ""); };
        $("found").appendChild(b);
      }
    };
    $("go").onclick = async () => {
      $("go").disabled = true; show("", "");
      const r = await window.pywebview.api.apply_settings({
        mode, data_dir: $("data_dir").value, port: $("port").value,
        admin_password: $("admin_password").value, server_url: $("server_url").value,
      });
      if (!r.ok) { show(r.error, "error"); $("go").disabled = false; }
    };
  }
  // Loading screen that takes too long (server unreachable, slow start): offer the settings
  setTimeout(() => { if (document.body.classList.contains("loading")) $("slow").hidden = false; }, 30000);
  $("slow-btn").onclick = () => window.pywebview && window.pywebview.api && window.pywebview.api.show_settings();
  let started = false;
  const start = () => { if (!started && !document.body.classList.contains("loading")) { started = true; init(); } };
  if (window.pywebview && window.pywebview.api && window.pywebview.api.get_state) start();
  else window.addEventListener("pywebviewready", start);
</script>
</body>
</html>
