# Windows desktop app (PyInstaller bundle + Inno Setup installer) and the Android APK.
# Manual run (Actions > Desktop > Run workflow) keeps the installer as a build artifact;
# a v* tag also publishes it as a GitHub release, which the app's update check reads.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements.txt
      - name: Install Python packages
        working-directory: desktop
        run: python -m pip install -r requirements.txt

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path backend/app/config.py -Pattern 'app_version: str = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME.TrimStart("v") -ne $v) {
            throw "Tag $env:GITHUB_REF_NAME does not match app_version $v in backend/app/config.py"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Bundle (PyInstaller)
        run: pyinstaller desktop/parca_takip.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test the bundle
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          $env:ERP_DESKTOP_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "smokecfg"
          $p = Start-Process -FilePath dist\LabERP\LabERP.exe -ArgumentList "--smoke", "`"$dir`"" -Wait -PassThru
          Get-Content (Join-Path $dir "smoke.json") -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:ERP_DESKTOP_CONFIG_DIR "desktop.log") -Tail 40 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }

      # First start on a new PC: fresh profile, the window must leave "açılıyor" and show the setup page
      - name: Window test (first start)
        shell: pwsh
        run: |
          $env:ERP_DESKTOP_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "uicfg"
          $out = Join-Path $env:RUNNER_TEMP "ui.json"
          $p = Start-Process -FilePath dist\LabERP\LabERP.exe -ArgumentList "--ui-test", "`"$out`"" -Wait -PassThru
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:ERP_DESKTOP_CONFIG_DIR "desktop.log") -Tail 40 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "window test failed ($($p.ExitCode))" }

      # Server profile: the close button must hide the window, keep the server up, a second start must
      # bring the window back and the app must still quit for real
      - name: Background test (tray)
        shell: pwsh
        run: |
          $env:ERP_DESKTOP_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "traycfg"
          New-Item -ItemType Directory -Force $env:ERP_DESKTOP_CONFIG_DIR | Out-Null
          $data = (Join-Path $env:RUNNER_TEMP "traydata").Replace("\", "/")
          @{ mode = "server"; data_dir = $data; port = 18150; jwt_secret = "ci-tray-test-secret-0123456789abcdef" } |
            ConvertTo-Json | Set-Content (Join-Path $env:ERP_DESKTOP_CONFIG_DIR "desktop.json") -Encoding utf8NoBOM
          $out = Join-Path $env:RUNNER_TEMP "tray.json"
          $p = Start-Process -FilePath dist\LabERP\LabERP.exe -ArgumentList "--tray-test", "`"$out`"" -Wait -PassThru
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:ERP_DESKTOP_CONFIG_DIR "desktop.log") -Tail 40 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "background test failed ($($p.ExitCode))" }

      # A swapped server certificate must stop the web view on an already open address, not only at connect
      - name: Certificate test (web view pin)
        shell: pwsh
        run: |
          $env:ERP_DESKTOP_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "pincfg"
          $out = Join-Path $env:RUNNER_TEMP "pin.json"
          $p = Start-Process -FilePath dist\LabERP\LabERP.exe -ArgumentList "--pin-test", "`"$out`"" -Wait -PassThru
          Get-Content $out -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:ERP_DESKTOP_CONFIG_DIR "desktop.log") -Tail 40 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "certificate test failed ($($p.ExitCode))" }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile dist\MicrosoftEdgeWebview2Setup.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: LabERP-Setup-${{ steps.ver.outputs.version }}
          path: dist/LabERP-Setup-*.exe

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist\LabERP-Setup-*.exe).FullName `
            --title "LAB ERP $env:GITHUB_REF_NAME" --notes-file desktop/RELEASE_NOTES.md

  # Android app (mobile/android): signed release APK, attached to the same release.
  # Signing comes from repository secrets ERP_KEYSTORE_B64 (base64 of release.jks), ERP_KEYSTORE_PASSWORD,
  # ERP_KEY_ALIAS and ERP_KEY_PASSWORD. Every release must use the same key, or phones cannot update.
  android:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Keystore
        id: ks
        env:
          KS: ${{ secrets.ERP_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::ERP_KEYSTORE_B64 secret missing: APK not built (attach a locally signed one)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ERP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.ks.outputs.skip != 'true'
        working-directory: mobile/android
        env:
          ERP_KEYSTORE_PASSWORD: ${{ secrets.ERP_KEYSTORE_PASSWORD }}
          ERP_KEY_ALIAS: ${{ secrets.ERP_KEY_ALIAS }}
          ERP_KEY_PASSWORD: ${{ secrets.ERP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          v=$(grep -oP 'app_version: str = "\K[^"]+' ../../backend/app/config.py)
          mkdir -p ../../dist
          # ABI splits -> LabERP-<v>-<abi>.apk, universal -> LabERP-<v>.apk
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            a=$(basename "$f" -release.apk); a=${a#app-}
            if [ "$a" = universal ]; then n="LabERP-$v.apk"; else n="LabERP-$v-$a.apk"; fi
            cp "$f" "../../dist/$n"
          done

      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.skip != 'true'
        with:
          name: LabERP-android
          path: dist/LabERP-*.apk

      - name: Release
        if: github.ref_type == 'tag' && steps.ks.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # universal last: 1.3.0 clients take the last .apk asset
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release upload "$GITHUB_REF_NAME" dist/LabERP-$v-*.apk --repo "$GITHUB_REPOSITORY"
          gh release upload "$GITHUB_REF_NAME" "dist/LabERP-$v.apk" --repo "$GITHUB_REPOSITORY"
