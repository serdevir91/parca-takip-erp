# Windows desktop app (PyInstaller bundle + Inno Setup installer) and the Android APK.
# Manual run (Actions > Desktop > Run workflow) keeps the installer as a build artifact;
# a v* tag also publishes it as a GitHub release, which the app's update check reads.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements.txt
      - name: Install Python packages
        working-directory: desktop
        run: python -m pip install -r requirements.txt

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path backend/app/config.py -Pattern 'app_version: str = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME.TrimStart("v") -ne $v) {
            throw "Tag $env:GITHUB_REF_NAME does not match app_version $v in backend/app/config.py"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Bundle (PyInstaller)
        run: pyinstaller desktop/parca_takip.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test the bundle
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          $p = Start-Process -FilePath dist\ParcaTakipERP\ParcaTakipERP.exe -ArgumentList "--smoke", "`"$dir`"" -Wait -PassThru
          Get-Content (Join-Path $dir "smoke.json") -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:APPDATA "ParcaTakipERP\desktop.log") -Tail 40 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile dist\MicrosoftEdgeWebview2Setup.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: ParcaTakipERP-Setup-${{ steps.ver.outputs.version }}
          path: dist/ParcaTakipERP-Setup-*.exe

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist\ParcaTakipERP-Setup-*.exe).FullName `
            --title "Parça Takip ERP $env:GITHUB_REF_NAME" --notes-file desktop/RELEASE_NOTES.md

  # Android app (mobile/android): signed release APK, attached to the same release.
  # Signing comes from repository secrets ERP_KEYSTORE_B64 (base64 of release.jks), ERP_KEYSTORE_PASSWORD,
  # ERP_KEY_ALIAS and ERP_KEY_PASSWORD. Every release must use the same key, or phones cannot update.
  android:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Keystore
        id: ks
        env:
          KS: ${{ secrets.ERP_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::ERP_KEYSTORE_B64 secret missing: APK not built (attach a locally signed one)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ERP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.ks.outputs.skip != 'true'
        working-directory: mobile/android
        env:
          ERP_KEYSTORE_PASSWORD: ${{ secrets.ERP_KEYSTORE_PASSWORD }}
          ERP_KEY_ALIAS: ${{ secrets.ERP_KEY_ALIAS }}
          ERP_KEY_PASSWORD: ${{ secrets.ERP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          v=$(grep -oP 'app_version: str = "\K[^"]+' ../../backend/app/config.py)
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk "../../dist/ParcaTakipERP-$v.apk"

      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.skip != 'true'
        with:
          name: ParcaTakipERP-android
          path: dist/ParcaTakipERP-*.apk

      - name: Release
        if: github.ref_type == 'tag' && steps.ks.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/ParcaTakipERP-*.apk --repo "$GITHUB_REPOSITORY"
